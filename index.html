<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InkSheet</title>
  <style>
    :root {
      color-scheme: dark;
      color: #000;
      background: #fff;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      background: #fff;
      color: #000;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    .app-shell {
      display: flex;
      flex-direction: column;
      min-height: 100%;
      width: 100%;
      max-width: none;
      margin: 0;
      padding: 10px;
      gap: 8px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border: 2px solid #000;
      background: #fff;
      font-weight: 700;
      min-height: 54px;
    }
    .logo { letter-spacing: 0.08em; font-size: 1.1rem; }
    .page-title { text-align: right; font-size: 0.95rem; }
    .section-nav, .subpage-nav {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      width: 100%;
    }
    .section-nav button, .subpage-nav button, .large-button, .pill, .small-pill, .inline-pill {
      border: 2px solid #000;
      background: #fff;
      color: #000;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }
    .section-nav button {
      flex: 1 1 0;
      min-width: 0;
      min-height: 54px;
      font-size: 0.98rem;
      padding: 10px 8px;
      white-space: nowrap;
    }
    .section-nav button.active, .subpage-nav button.active {
      background: #000;
      color: #fff;
    }
    .subpage-nav button {
      flex: 1 1 0;
      min-width: 0;
      min-height: 44px;
      font-size: 0.9rem;
      padding: 8px 6px;
      white-space: nowrap;
    }
    .content-shell {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 2px solid #000;
      padding: 10px;
      background: #fff;
    }
    .panel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: visible;
    }
    .stack { display: flex; flex-direction: column; gap: 8px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .character-card { gap: 10px; padding: 12px; }
    .character-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 2px solid #000;
      padding-bottom: 6px;
      font-weight: 900;
      letter-spacing: 0.06em;
    }
    .character-heading span { font-size: 0.78rem; font-weight: 700; letter-spacing: 0; }
    .character-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 14px;
      row-gap: 8px;
    }
    .character-grid .field { gap: 2px; min-width: 0; }
    .character-grid label {
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .character-grid input[type="text"], .character-grid input[type="number"], .character-grid select {
      min-height: 34px;
      border: 0;
      border-bottom: 2px solid #000;
      padding: 4px 2px;
      font-size: 0.95rem;
      background: #fff;
      color: #000;
      border-radius: 0;
    }
    .compact-select { width: 100%; }
    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    label, .label-text {
      font-size: 0.9rem;
      font-weight: 700;
    }
    input[type="text"], input[type="number"], textarea {
      width: 100%;
      border: 2px solid #000;
      padding: 10px;
      font-size: 1rem;
      background: #fff;
      color: #000;
    }
    textarea {
      flex: 1;
      min-height: 180px;
      resize: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
    }
    .large-button {
      width: 100%;
      min-height: 50px;
      font-size: 1rem;
      padding: 12px;
    }
    .pill, .small-pill, .inline-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      padding: 0 10px;
      min-height: 46px;
    }
    .pill {
      width: 54px;
      min-width: 54px;
      font-size: 1.25rem;
    }
    .small-pill {
      min-width: 54px;
      padding: 0 8px;
    }
    .inline-pill {
      min-height: 40px;
      padding: 0 10px;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border: 2px solid #000;
      padding: 10px;
      background: #fff;
    }
    .card-title {
      font-weight: 700;
      font-size: 1rem;
      text-align: center;
    }
    .card-value {
      text-align: center;
      font-size: 2rem;
      font-weight: 900;
      border: 2px solid #000;
      padding: 14px 10px;
      background: #fff;
    }
    .card-input {
      width: 100%;
      border: 2px solid #000;
      padding: 14px 10px;
      font-size: 1.6rem;
      font-weight: 900;
      text-align: center;
      background: #fff;
      color: #000;
    }
    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .stat-row, .ability-row, .skill-row, .resource-row, .inventory-row {
      display: grid;
      grid-template-columns: 1.2fr auto auto auto;
      gap: 8px;
      align-items: center;
      width: 100%;
    }
    .stat-row .stat-name, .ability-row .ability-name, .skill-row .skill-name, .resource-row .resource-name, .inventory-row .item-name {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .stat-value, .modifier-value, .resource-value, .quantity-value {
      min-width: 58px;
      text-align: center;
      border: 2px solid #000;
      padding: 10px 6px;
      background: #fff;
      font-weight: 700;
    }
    .modifier-value { min-width: 72px; }
    .resource-row, .inventory-row {
      grid-template-columns: minmax(0, 1fr) auto auto auto auto;
    }
    .money-row {
      display: grid;
      grid-template-columns: minmax(105px, 1fr) auto auto;
      gap: 8px;
      align-items: center;
    }
    .money-actions {
      display: flex;
      gap: 4px;
      justify-content: flex-end;
    }
    .money-step {
      min-width: 42px;
      min-height: 40px;
      padding: 0 4px;
      font-size: 0.85rem;
    }
    .spell-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      min-height: 0;
    }
    .spell-row {
      display: grid;
      grid-template-columns: 1.4fr 0.9fr 2fr;
      gap: 10px;
      align-items: center;
      border-bottom: 1px solid #000;
      padding-bottom: 8px;
    }
    .spell-level {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      white-space: nowrap;
    }
    .spell-badge {
      width: 34px;
      height: 34px;
      border: 2px solid #000;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }
    .spell-circles {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }
    .slot-circle {
      width: 42px;
      height: 42px;
      border: 2px solid #000;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: #fff;
      font-size: 1rem;
      font-weight: 700;
      user-select: none;
    }
    .slot-circle.used {
      background: #000;
      color: #fff;
    }
    .counter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .counter-card {
      border: 2px solid #000;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #fff;
    }
    .counter-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .counter-input {
      flex: 1;
      border: 2px solid #000;
      padding: 10px;
      font-size: 1rem;
      text-align: center;
      background: #fff;
      color: #000;
    }
    .death-save-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: start;
    }
    .save-group { display: flex; flex-direction: column; gap: 8px; }
    .save-circles {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .save-circle {
      width: 44px;
      height: 44px;
      border: 2px solid #000;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      background: #fff;
      user-select: none;
    }
    .save-circle.success {
      background: #000;
      color: #fff;
    }
    .save-circle.failure {
      background: #fff;
      color: #000;
    }
    .conditions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .condition-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid #000;
    }
    .condition-row input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #000;
    }
    .condition-row .condition-label {
      font-size: 0.95rem;
      font-weight: 700;
      flex: 1;
    }
    .condition-row .exhaustion-input {
      width: 54px;
      border: 2px solid #000;
      padding: 8px;
      text-align: center;
      background: #fff;
      color: #000;
    }
    .help-text {
      font-size: 0.85rem;
      line-height: 1.3;
    }
    .status-bar {
      font-size: 0.85rem;
      text-align: center;
      min-height: 24px;
      line-height: 24px;
      color: #000;
    }
    .muted { color: #000; }
    .hidden { display: none !important; }
    @media (max-width: 680px) {
      .grid-2, .grid-3, .counter-grid, .death-save-grid, .conditions-grid { grid-template-columns: 1fr; }
      .character-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 10px; row-gap: 6px; }
      .stat-row, .skill-row { grid-template-columns: 1fr auto auto; }
      .ability-row { grid-template-columns: minmax(42px, 0.7fr) 58px 58px auto; gap: 6px; }
      .ability-row .inline-pill { min-width: 0; min-height: 38px; padding: 0 6px; font-size: 0.85rem; white-space: nowrap; }
      .ability-row .stat-value, .ability-row .modifier-value { min-width: 0; padding: 8px 4px; }
      .resource-row, .inventory-row { grid-template-columns: minmax(0, 1fr) auto auto auto auto; }
      .money-row { grid-template-columns: minmax(90px, 1fr) auto auto; }
      .spell-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
      .spell-row { grid-template-columns: auto auto minmax(0, 1fr); gap: 4px; padding: 6px; border: 2px solid #000; }
      .spell-level { gap: 0; }
      .spell-level > div:not(.spell-badge) { display: none; }
      .spell-badge { width: 30px; height: 30px; }
      .spell-circles { gap: 4px; justify-content: flex-start; }
      .slot-circle { width: 34px; height: 34px; font-size: 0.85rem; }
    }
  </style>
</head>
